name: Sync Upstream

on:
  schedule:
    # Run every 12 hours (00:00 and 12:00 UTC)
    - cron: '0 */12 * * *'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to sync (default: main)'
        required: false
        default: 'main'
        type: string

concurrency:
  group: sync-upstream-${{ github.event.inputs.branch || 'main' }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      BRANCH: ${{ github.event.inputs.branch || 'main' }}
      # Use a PAT with repo+workflow scope when available. The default GITHUB_TOKEN
      # cannot push upstream workflow-file changes into a fork.
      SYNC_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ env.SYNC_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Add upstream remote
        run: |
          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream https://github.com/NousResearch/hermes-agent.git
          else
            git remote add upstream https://github.com/NousResearch/hermes-agent.git
          fi
          git fetch --prune --tags upstream
          git fetch --prune origin

      - name: Merge upstream changes
        run: |
          set -euo pipefail
          git checkout "$BRANCH"

          UPSTREAM_AHEAD=$(git rev-list --count "HEAD..upstream/${BRANCH}")

          if [ "$UPSTREAM_AHEAD" -eq 0 ]; then
            echo "✓ Fork is already up to date with upstream/${BRANCH}"
            exit 0
          fi

          echo "→ upstream/${BRANCH} is $UPSTREAM_AHEAD commit(s) ahead; merging into fork ${BRANCH}..."

          if git merge "upstream/${BRANCH}" --no-edit; then
            echo "✓ Successfully merged upstream/${BRANCH}"
          else
            echo "✗ Merge conflict detected; manual resolution required."
            git merge --abort
            exit 1
          fi

      - name: Push to fork
        run: |
          set -euo pipefail
          git push origin "HEAD:${BRANCH}"
          echo "✓ Pushed synced ${BRANCH} to fork"

      - name: Failure summary
        if: failure()
        run: |
          {
            echo '## Upstream sync failed'
            echo
            echo "Repository: ${GITHUB_REPOSITORY}"
            echo "Branch: ${BRANCH}"
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo 'If the push failed with `refusing to allow a GitHub App to create or update workflow`, ensure repo secret `UPSTREAM_SYNC_TOKEN` contains a PAT with `repo` and `workflow` scopes.'
          } >> "$GITHUB_STEP_SUMMARY"
